<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IE 1 - Gestion de Usuarios</title>
  <link rel="stylesheet" href="./src/output.css" />
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-8">
    <!-- Tarjeta del Formulario -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Nuevo Usuario</h1>
      <p class="text-slate-500 text-sm mb-6">
        Complete los campos para registrar un nuevo usuario.
      </p>

      <form id="formUsuario" class="space-y-4" novalidate>

        <div>
          <label for="nombre" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
            Nombre
          </label>

          <input type="text" id="nombre"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            placeholder="Ingresar Nombre" />

          <p id="errorNombre" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>


        <!-- contenedor de edad y telefono -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

          <div>
            <label for="edad" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
              Edad
            </label>

            <input type="number" id="edad" min="1" max="120"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              placeholder="Edad" />

            <p id="errorEdad" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>

          <div>
            <label for="telefono" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
              Teléfono
            </label>

            <input type="tel" id="telefono"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
              placeholder="Nro de teléfono" />

            <p id="errorTelefono" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>

        </div>

        <div>
          <label for="email" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
            Email
          </label>

          <input type="email" id="email" autocomplete="username"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            placeholder="correo@mail.com" />

          <p id="errorEmail" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>


        <div>
          <label for="password" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
            Contraseña
          </label>

          <input type="password" id="password" autocomplete="new-password"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            placeholder="Contraseña" />

          <p id="errorPassword" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <div class="flex items-center gap-2 mt-1">

          <input type="checkbox" id="verPassword"
            class="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500" />

          <label for="verPassword" class="text-sm text-slate-600">
            Mostrar contraseña
          </label>

        </div>

        <div>
          <label for="passwordConfirm" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
            Repetir Contraseña
          </label>

          <input type="password" id="passwordConfirm" autocomplete="new-password"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            placeholder="Repetir Contraseña" />

          <p id="errorPasswordConfirm" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <div class="flex items-center gap-2 pt-1">

          <input type="checkbox" id="activo" checked
            class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />

          <label for="activo" class="text-sm font-medium text-slate-700">
            Usuario Activo
          </label>

        </div>

        <div class="flex items-center justify-center">
          <button type="submit" id="btnGuardar" disabled
            class="bg-slate-400 text-white px-4 py-2 rounded-lg cursor-not-allowed">
            Guardar
          </button>
        </div>

      </form>
    </div>

    <!-- tarjeta de la tabla de usuarios -->
    <div class="bg-white rounded-2xl shadow-xl p-8 overflow-x-auto">
      <h2 class="text-xl font-bold text-slate-900 mb-4">
        Usuarios Registrados
      </h2>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-slate-200 text-xs uppercase text-slate-500">
            <th class="py-3 px-4">Id</th>
            <th class="py-3 px-4">Nombre</th>
            <th class="py-3 px-4">Edad</th>
            <th class="py-3 px-4">Email</th>
            <th class="py-3 px-4">Teléfono</th>
            <th class="py-3 px-4">Estado</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios" class="divide-y divide-slate-100 text-sm text-slate-700">
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
